name: Validate research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,reports]'
      - run: make check PYTHON=python
      - run: python scripts/availability_experiment.py
      - run: git diff --exit-code experiments/availability/results.json
      - run: python scripts/render_note.py research_log/2026-09-21.md /tmp/learning-note.pdf
